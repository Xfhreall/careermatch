name = "careermatch-capstone"
main = ".output/server/index.mjs"
compatibility_date = "2026-05-16"
compatibility_flags = ["nodejs_compat"]
account_id = "82a6a4e89ea2c4f761add823c23abcfc"
no_bundle = true

[assets]
binding = "ASSETS"
directory = ".output/public"

[[rules]]
type = "ESModule"
globs = ["**/*.mjs", "**/*.js"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
